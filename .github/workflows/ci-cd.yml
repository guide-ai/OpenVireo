# OpenVireo CI/CD (user decision, 2026-11-08): every push to main or a claude/ work branch, and every pull request, runs the
# full checks; a push to main that passes
# them is published to Cloudflare Pages (project openvireo, https://openvireo.space). Only the static site is deployed
# (the ordinary `npm run build` output). The Cloudflare API token and account ID live only as secrets of the GitHub
# environment `production`, which only main may use (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID); see docs/DEPLOY.md § 11.
# The pinned wrangler (local Pages server for the release tests, and the deploy) is installed from tools/wrangler.
# Security review of 2026-11-14: every action is pinned to a commit (the comment names its release; Dependabot,
# .github/dependabot.yml, proposes updates), checkouts do not keep the workflow token, and the deploy job publishes the very
# dist/ that the Pages checks tested instead of building a second time.
name: CI/CD

on:
  push:
    # main deploys; the coordinator's work branches (claude/<front>) get the same checks before they are merged.
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request supersedes its older run; runs on main always finish, so each one can deploy in order.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: 'false'
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/browsers

jobs:
  unit:
    name: Types, unit tests and resource checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/check-resources.mjs
      - run: npx tsc -b
      # Some scientific contracts take a few seconds each; the CI runner gets a wider per-test timeout than a workstation.
      - run: npx vitest run --testTimeout=30000
      - run: npm run test:resources
      - run: npm run test:deploy-limits

  e2e:
    # Front SC10/SC12 review: Playwright's --shard splits by test count in file order, so the one file of the exports identity
    # (tests/i18n/exports-identity.spec.ts: a test per export family and language, each running the family's whole flow) fell
    # in a single shard. It runs in two parts of its own; the four general shards run every other test (its path filtered out).
    name: Browser tests (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: 1/4, key: 1, select: '--grep-invert="exports-identity\.spec" --shard=1/4'}
          - {part: 2/4, key: 2, select: '--grep-invert="exports-identity\.spec" --shard=2/4'}
          - {part: 3/4, key: 3, select: '--grep-invert="exports-identity\.spec" --shard=3/4'}
          - {part: 4/4, key: 4, select: '--grep-invert="exports-identity\.spec" --shard=4/4'}
          - {part: exports 1/2, key: exports-1, select: 'tests/i18n/exports-identity.spec.ts --shard=1/2'}
          - {part: exports 2/2, key: exports-2, select: 'tests/i18n/exports-identity.spec.ts --shard=2/2'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test ${{ matrix.select }} --reporter=line
      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.key }}
          path: test-results/
          retention-days: 7

  scripts:
    # Front SC1 (docs/I18N.md; plan front-i18n-scripts.md § 5): the checks for non-Latin scripts (Japanese, Chinese, Hindi,
    # Russian) under pinned test fonts, with their own config (playwright.scripts.config.ts). The runner is pinned to
    # ubuntu-24.04 so its font packages do not change with the ubuntu-latest image; the fonts come from the Ubuntu archive,
    # the same source Playwright's --with-deps already installs from, and scripts/test-fonts.mjs logs each file's SHA-256.
    # Front SC10/SC12 review: two parts, each with the 30-minute limit and its own font install. Playwright's --shard splits by
    # test count in file order, which would leave every deep walk (tests/scripts/walks.scripts.ts, about three quarters of the
    # time) in one part; the parts are instead the deep walks under qps-deva, qps-cyrl and qps-rtl, and everything else (the
    # other script files and the qps-cjk walks). The two selections are complements, so no test is left out.
    # Front RT7: three parts, so each stays under about 15 minutes with the qps-rtl deep walks at both widths and the RTL route walk.
    # Part 2 is still the deep walks under qps-deva, qps-cyrl and qps-rtl; part 3 the two right-to-left files (rtl-css.scripts.ts and
    # rtl.scripts.ts, matched by file name); part 1 the complement of both.
    name: Script fonts (ja, zh, hi, ru, rtl) (${{ matrix.part }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1
            select: '--grep-invert="under qps-(deva|cyrl|rtl) at |rtl(-css)?\.scripts\.ts"'
          - part: 2
            select: '--grep="under qps-(deva|cyrl|rtl) at "'
          - part: 3
            select: '--grep="rtl(-css)?\.scripts\.ts"'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/browsers
          key: playwright-ubuntu-24.04-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Install the test fonts (Noto Sans CJK, Noto Sans Devanagari, DejaVu)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core fonts-dejavu-mono fonts-noto-cjk fonts-noto-core
      - run: npm run test:test-fonts
      # Writes the private fontconfig and prints the font-hash log (a font package update shows here first).
      - run: npm run test-fonts
      - run: npm run test:scripts -- --reporter=line ${{ matrix.select }}
      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scripts-results-${{ matrix.part }}
          path: test-results/
          retention-days: 7

  pages:
    name: Build and Cloudflare Pages checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/wrangler/package-lock.json
      - run: npm ci --ignore-scripts
      # As docs/DEPLOY.md: the pinned wrangler 4.150.0 (and its workerd binary for the local Pages server).
      - run: npm ci
        working-directory: tools/wrangler
      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # Builds dist/, checks it fits the Pages limits, then serves it with wrangler pages dev
      # on loopback (no account) and runs the release smoke tests against it.
      - run: npm run build
      - run: npm run test:pages -- --reporter=line
      # The tested build is what gets published: the deploy job downloads this artifact (kept one day). Hidden files are
      # included because the site serves dist/.well-known/security.txt.
      - name: Keep the tested build for the deploy job
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          # Most of the bytes are binary catalogue tiles: a light compression keeps the upload quick.
          compression-level: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [unit, e2e, pages, scripts]
    # A push to main, or Actions › CI/CD › Run workflow on main (docs/DEPLOY.md § 11.1).
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://openvireo.space
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # The checkout is only for tools/wrangler (the pinned wrangler) and the limits check; the site is not built here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/wrangler/package-lock.json
      # As docs/DEPLOY.md: the pinned wrangler 4.150.0.
      - run: npm ci
        working-directory: tools/wrangler
      - name: Fetch the build the Pages checks tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist
      - name: Check the build arrived whole
        run: |
          for f in index.html 404.html _headers _redirects .well-known/security.txt; do
            [ -s "dist/$f" ] || { echo "::error::dist/$f is missing from the tested build."; exit 1; }
          done
          node scripts/check-deploy-limits.mjs
      # Run from the repository root: no wrangler configuration file exists, the command line says everything.
      - name: Publish dist/ to the openvireo Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are not set (docs/DEPLOY.md § 11)."
            exit 1
          fi
          tools/wrangler/node_modules/.bin/wrangler pages deploy dist --project-name=openvireo --branch=main \
            --commit-hash="$COMMIT_SHA" --commit-message="CI deploy of $COMMIT_SHA"
