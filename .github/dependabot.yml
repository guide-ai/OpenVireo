# Security review of 2026-11-14: dependency versions are pinned exactly (package-lock.json) and actions are pinned to a
# commit, so nothing moves by itself; Dependabot proposes the updates as pull requests, which run the full CI and never
# deploy. One grouped pull request a month for each set keeps the noise low. GitHub's separate security alerts are immediate.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      app:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /tools/wrangler
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      wrangler:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
